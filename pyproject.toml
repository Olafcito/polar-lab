[project]
name = "polar-lab"
version = "0.1.0"
description = "Polar experiments: H10 BLE recording + AccessLink API + Flow export probes"
requires-python = ">=3.12"
dependencies = [
    "bleak>=0.22",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polar_lab"]
